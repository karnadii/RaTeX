name: ratex_flutter
description: Flutter bindings for RaTeX — native LaTeX math rendering via Dart FFI.
version: 0.1.14
homepage: https://github.com/erweixin/RaTeX
repository: https://github.com/erweixin/RaTeX
issue_tracker: https://github.com/erweixin/RaTeX/issues
documentation: https://github.com/erweixin/RaTeX/tree/main/platforms/flutter#readme

topics:
  - latex
  - math
  - flutter
  - ffi

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        # FFI-only plugin: no Dart method channel.
        # The native RaTeXPlugin.swift class handles plugin registration,
        # and DynamicLibrary.process() resolves the C symbols at runtime.
        pluginClass: RaTeXPlugin
        fileName: ratex_flutter.dart
      android:
        package: io.ratex
        pluginClass: RaTeXPlugin
        fileName: ratex_flutter.dart
      macos:
        pluginClass: RaTeXPlugin
        fileName: ratex_flutter.dart
      windows:
        pluginClass: RatexFlutterPluginCApi
        fileName: ratex_flutter.dart
      linux:
        pluginClass: RatexFlutterPlugin
        fileName: ratex_flutter.dart

  assets:
    - web/pkg/ratex_wasm.js
    - web/pkg/ratex_wasm_bg.wasm

  # KaTeX fonts bundled with the plugin.
  # GlyphPath items in the DisplayList carry a font ID (e.g. "Math-Italic")
  # and a Unicode char_code; the painter draws them with these font families.
  #
  # Every font FILE gets its OWN family (the file's stem, e.g.
  # KaTeX_Math-Italic) with NO weight/style descriptors. KaTeX's italic and
  # bold faces bake the slant/weight into the glyph OUTLINES but leave the
  # files internally flagged "Regular" (italicAngle 0, no italic/bold bits).
  # One family per group + `style: italic`/`weight: 700` would make the
  # engine add SYNTHETIC oblique/bold on top of the already-styled outlines
  # (a visible double slant). Selecting the exact file by family + normal
  # style avoids that, matching KaTeX's own rendering.
  #
  # The painter asks for these families by their manifest key
  # (`packages/ratex_flutter/<family>`), because `ui.ParagraphBuilder` has no
  # `package:` field and a plugin's fonts are only registered under the
  # package-namespaced name.
  fonts:
    - family: KaTeX_AMS-Regular
      fonts:
        - asset: lib/fonts/KaTeX_AMS-Regular.ttf

    - family: KaTeX_Caligraphic-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Caligraphic-Regular.ttf

    - family: KaTeX_Caligraphic-Bold
      fonts:
        - asset: lib/fonts/KaTeX_Caligraphic-Bold.ttf

    - family: KaTeX_Fraktur-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Fraktur-Regular.ttf

    - family: KaTeX_Fraktur-Bold
      fonts:
        - asset: lib/fonts/KaTeX_Fraktur-Bold.ttf

    - family: KaTeX_Main-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Main-Regular.ttf

    - family: KaTeX_Main-Bold
      fonts:
        - asset: lib/fonts/KaTeX_Main-Bold.ttf

    - family: KaTeX_Main-Italic
      fonts:
        - asset: lib/fonts/KaTeX_Main-Italic.ttf

    - family: KaTeX_Main-BoldItalic
      fonts:
        - asset: lib/fonts/KaTeX_Main-BoldItalic.ttf

    - family: KaTeX_Math-Italic
      fonts:
        - asset: lib/fonts/KaTeX_Math-Italic.ttf

    - family: KaTeX_Math-BoldItalic
      fonts:
        - asset: lib/fonts/KaTeX_Math-BoldItalic.ttf

    - family: KaTeX_SansSerif-Regular
      fonts:
        - asset: lib/fonts/KaTeX_SansSerif-Regular.ttf

    - family: KaTeX_SansSerif-Bold
      fonts:
        - asset: lib/fonts/KaTeX_SansSerif-Bold.ttf

    - family: KaTeX_SansSerif-Italic
      fonts:
        - asset: lib/fonts/KaTeX_SansSerif-Italic.ttf

    - family: KaTeX_Script-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Script-Regular.ttf

    - family: KaTeX_Typewriter-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Typewriter-Regular.ttf

    - family: KaTeX_Size1-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size1-Regular.ttf

    - family: KaTeX_Size2-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size2-Regular.ttf

    - family: KaTeX_Size3-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size3-Regular.ttf

    - family: KaTeX_Size4-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size4-Regular.ttf
